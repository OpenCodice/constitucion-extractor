name: Vigilar reformas CPEUM

# Vigila el PDF oficial de la Constitución y abre un PR cuando el texto vigente
# cambia (= hubo una reforma publicada en el DOF). La detección de cambios la
# hace git: se regenera el texto y se compara; NO se comparan bytes del PDF.
#
# El PR trae solo el texto + metadata (regeneración determinista y gratuita).
#
# Vive en el extractor, no en el repo de datos, para que el historial de
# constitucion-mexicana solo tenga cambios de texto legal. Lo lanza cada lunes el Worker
# `scheduler` (ver scheduler/); el PR se abre en constitucion-mexicana con PR_TOKEN.

on:
  workflow_dispatch:
    inputs:
      reintento:
        description: 'Reintento automático tras una falla'
        type: boolean
        default: false

permissions:
  contents: write               # crear la rama y commitear
  pull-requests: write          # abrir el PR

env:
  # Repo del extractor (código).
  EXTRACTOR_REPO: https://github.com/OpenCodice/constitucion-extractor.git
  PDF_URL: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf
  TIENE_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

# Una corrida a la vez (el programador, su vigilante o una a mano pueden
# coincidir); la siguiente espera en cola.
concurrency:
  group: vigilar-constitucion-mexicana
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      - name: Checkout del repo de datos
        uses: actions/checkout@v5
        with:
          repository: OpenCodice/constitucion-mexicana
          token: ${{ secrets.PR_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Clonar extractor e instalar dependencias
        run: |
          git clone --depth 1 "$EXTRACTOR_REPO" /tmp/extractor
          pip install -r /tmp/extractor/requirements.txt

      - name: Descargar el PDF vigente
        run: curl -sSL --retry 3 -o /tmp/CPEUM.pdf "$PDF_URL"

      - name: Regenerar texto + metadata desde el PDF
        run: |
          cd /tmp/extractor
          PYTHONPATH=/tmp/extractor python -m extractor build \
            --pdf /tmp/CPEUM.pdf --out "$GITHUB_WORKSPACE"

      - name: Agente — verificar contra el PDF y reparar el extractor si hace falta
        timeout-minutes: 90
        if: env.TIENE_CLAUDE == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PDF: /tmp/CPEUM.pdf
          OUT: ${{ github.workspace }}
          PERFIL: cpeum
        run: bash /tmp/extractor/scripts/agente/correr.sh

      - name: Compuertas del arreglo del agente
        # Sin secretos: pruebas, cobertura e impacto del arreglo en todas las
        # constituciones publicadas.
        id: compuertas
        if: env.TIENE_CLAUDE == 'true'
        env:
          PDF: /tmp/CPEUM.pdf
          OUT: ${{ github.workspace }}
          PERFIL: cpeum
        run: |
          bash /tmp/extractor/scripts/agente/cerrar.sh compuertas
          echo "arreglo=$(python3 -c 'import json; print(json.load(open("/tmp/agente/arreglo.json"))["estado"])' 2>/dev/null || echo ninguno)" >> "$GITHUB_OUTPUT"

      - name: Agente — confirmar el impacto del arreglo en el corpus
        if: steps.compuertas.outputs.arreglo == 'impacto'
        timeout-minutes: 120
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IMPACTO: /tmp/agente/impacto-arreglo
        run: bash /tmp/extractor/scripts/agente/impacto.sh

      - name: Publicar el arreglo y veredicto
        id: agente
        if: env.TIENE_CLAUDE == 'true'
        env:
          EXTRACTOR_TOKEN: ${{ secrets.PR_TOKEN }}
          EXTRACTOR_SLUG: OpenCodice/constitucion-extractor
          REPORTE: /tmp/verificacion.md
          PDF: /tmp/CPEUM.pdf
          OUT: ${{ github.workspace }}
          PERFIL: cpeum
        run: |
          if bash /tmp/extractor/scripts/agente/cerrar.sh publicar; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Veredicto de verificación
        id: veredicto
        run: echo "ok=${{ steps.agente.outputs.ok }}" >> "$GITHUB_OUTPUT"

      - name: ¿Cambió el texto vigente?
        id: cambios
        run: |
          # Una reforma = cambió el TEXTO LEGAL de los artículos. Miramos solo
          # `articulos/` a propósito: cambios de metadata/esquema (p. ej. un campo
          # nuevo en pasajes.jsonl) regeneran el árbol pero NO son una reforma y
          # no deben abrir un PR de "reforma".
          if [ -n "$(git status --porcelain -- articulos fuente/ruido.json)" ]; then
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
            git status --short -- articulos
          else
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
            echo "Sin reforma: el texto de los artículos coincide con el repo."
            if [ -n "$(git status --porcelain)" ]; then
              echo "Nota: hay diffs solo de metadata/esquema (no reforma):"
              git status --short
            fi
          fi

      - name: Generar cuerpo del PR
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          python /tmp/extractor/scripts/pr_summary.py "$GITHUB_WORKSPACE" > /tmp/cuerpo.md
          if [ -f /tmp/verificacion.md ]; then
            { echo; cat /tmp/verificacion.md; } >> /tmp/cuerpo.md
          fi
          cat /tmp/cuerpo.md

      - name: Commit con trailers
        # El tipo (reforma, corrección) sale de la causa, no del agente: si el
        # PDF cambió y el extractor actual también lee distinto el anterior, son
        # dos commits. El PDF nuevo entra a fuente/ con la reforma.
        id: commits
        if: steps.cambios.outputs.hay_cambios == 'true' && steps.veredicto.outputs.ok == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          PYTHONPATH=/tmp/extractor python /tmp/extractor/scripts/commits_constitucion.py "$GITHUB_WORKSPACE" \
            --documento cpeum --perfil cpeum --pdf /tmp/CPEUM.pdf --url "$PDF_URL"

      - name: Correcciones por confirmar
        # Una corrección (mismo PDF, otro extractor) solo se publica si cada
        # artículo que cambia está confirmado como mejora en el registro del
        # extractor (scripts/impacto.py). Lo que falte lo juzga el agente.
        id: correcciones
        if: steps.commits.outcome == 'success'
        run: |
          # Huella del registro antes del agente juez: lo que cambie en él
          # hasta `impacto.py cerrar` lo escribió el agente y no cuenta.
          echo "registro=$(git -C /tmp/extractor status --porcelain -uall -- verificaciones | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          python /tmp/extractor/scripts/impacto.py pendientes-commits "$GITHUB_WORKSPACE" \
            --base "${{ steps.commits.outputs.base }}" --trabajo /tmp/agente/impacto-vigilancia --pdf-dir /tmp \
            --veredicto-agente /tmp/agente/veredicto.json \
            --extractor "OpenCodice/constitucion-extractor@$(git -C /tmp/extractor rev-parse HEAD)"

      - name: Agente — confirmar las correcciones
        if: steps.correcciones.outputs.pendientes == 'true' && env.TIENE_CLAUDE == 'true'
        timeout-minutes: 90
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IMPACTO: /tmp/agente/impacto-vigilancia
        run: bash /tmp/extractor/scripts/agente/impacto.sh

      - name: Registrar y exigir las correcciones confirmadas
        id: exigir
        if: steps.commits.outcome == 'success'
        env:
          EXTRACTOR_TOKEN: ${{ secrets.PR_TOKEN }}
          EXTRACTOR_SLUG: OpenCodice/constitucion-extractor
        run: |
          # El registro solo lo escribe `impacto.py cerrar`: lo que haya
          # cambiado en él durante el agente juez no puede contar como confirmado.
          if [ "$(git -C /tmp/extractor status --porcelain -uall -- verificaciones | sha256sum | cut -c1-16)" != "${{ steps.correcciones.outputs.registro }}" ]; then
            echo "::error::El registro de verificaciones cambió durante el agente juez; no se publica."
            exit 1
          fi
          if [ "${{ steps.correcciones.outputs.pendientes }}" = true ]; then
            python /tmp/extractor/scripts/impacto.py cerrar --trabajo /tmp/agente/impacto-vigilancia \
              --extractor "OpenCodice/constitucion-extractor@$(git -C /tmp/extractor rev-parse HEAD)" \
              --reporte /tmp/agente/impacto-vigilancia.md || true
          fi
          bash /tmp/extractor/scripts/agente/publicar_registro.sh "Correcciones verificadas de cpeum"
          python /tmp/extractor/scripts/impacto.py exigir "$GITHUB_WORKSPACE" \
            --base "${{ steps.commits.outputs.base }}" && rc=0 || rc=$?
          # 0: todo confirmado; 1: hay que rehacer los commits. Otra cosa (una
          # excepción) no dice nada: no se publica.
          [ "$rc" -le 1 ] || { echo "::error::No se pudo comprobar el registro de correcciones (código $rc)."; exit 1; }

      - name: Rehacer los commits sin las correcciones no confirmadas
        if: steps.exigir.outputs.rehacer == 'true'
        run: |
          git reset -q --mixed "${{ steps.commits.outputs.base }}"
          PYTHONPATH=/tmp/extractor python /tmp/extractor/scripts/commits_constitucion.py "$GITHUB_WORKSPACE" \
            --documento cpeum --perfil cpeum --pdf /tmp/CPEUM.pdf --url "$PDF_URL" \
            --verificadas /tmp/extractor/verificaciones/impacto
          [ -f /tmp/agente/impacto-vigilancia.md ] && cat /tmp/agente/impacto-vigilancia.md >> "$GITHUB_STEP_SUMMARY" || true
          # Lo que quede sin confirmar después de rehacer no se publica.
          python /tmp/extractor/scripts/impacto.py exigir "$GITHUB_WORKSPACE" --base "${{ steps.commits.outputs.base }}"

      - name: ¿Quedó algo que publicar?
        id: publicable
        if: steps.commits.outcome == 'success'
        run: |
          # create-pull-request también sube lo que quede sin commit, y eso no
          # pasó por los commits verificados: se descarta.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Quedaron cambios sin commit tras los commits verificados; se descartan."
            git status --porcelain | head -20
            git checkout -q -- . && git clean -fdq
          fi
          echo "si=$([ "$(git rev-list --count "${{ steps.commits.outputs.base }}..HEAD")" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Abrir Pull Request
        id: pr
        # Solo se publica lo verificado. Lo que no pasó las compuertas no se
        # publica: el texto vigente se queda como está y la siguiente vigilancia
        # lo vuelve a intentar, con el agente reparando el extractor.
        if: steps.publicable.outputs.si == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Con un PAT (secret PR_TOKEN) el PR nace atribuido a un usuario real.
          # Si el secret no existe, cae al GITHUB_TOKEN y el PR no se fusiona.
          token: ${{ secrets.PR_TOKEN || github.token }}
          branch: reforma/cpeum-deteccion-automatica
          base: main
          title: '🏛️ Posible reforma a la CPEUM (detección automática)'
          body-path: /tmp/cuerpo.md
          labels: |
            reforma
            automatico
            verificado
            ${{ steps.commits.outputs.tipo == 'correccion' && 'correccion-extraccion' || '' }}
          delete-branch: true

      - name: Anotar lo que no se publicó
        if: steps.cambios.outputs.hay_cambios == 'true' && steps.veredicto.outputs.ok != 'true'
        run: |
          {
            echo "## Cambios no publicados"
            echo "La extracción no pasó las compuertas; se conserva el texto vigente y la próxima vigilancia lo reintenta."
            if [ -f /tmp/verificacion.md ]; then cat /tmp/verificacion.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

  revisar:
    # Valida el PR en un job sin secretos y, si pasó y quedó verificado, lo
    # fusiona (revisar-pr.yml). Corre aunque la vigilancia haya fallado
    # después de abrirlo.
    needs: vigilar
    if: ${{ !cancelled() && needs.vigilar.outputs.pr != '' }}
    uses: ./.github/workflows/revisar-pr.yml
    with:
      repo: OpenCodice/constitucion-mexicana
      pr: ${{ needs.vigilar.outputs.pr }}
      prefijo: reforma/
    secrets:
      PR_TOKEN: ${{ secrets.PR_TOKEN }}

  salud:
    needs: [vigilar, revisar]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reintentar una vez si falló
        # Casi todas las fallas son de red o de la fuente oficial: se reintenta
        # solo, una vez. Si el reintento también falla, la siguiente vigilancia
        # semanal lo vuelve a intentar.
        if: (needs.vigilar.result == 'failure' || needs.revisar.result == 'failure') && inputs.reintento != true
        run: gh workflow run vigilar-cpeum.yml -R "$GITHUB_REPOSITORY" --ref main -f reintento=true

      - name: Dejar constancia si también falló el reintento
        if: (needs.vigilar.result == 'failure' || needs.revisar.result == 'failure') && inputs.reintento == true
        run: |
          titulo="🚨 Falló: ${{ github.workflow }}"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
                --search "in:title \"$titulo\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Volvió a fallar tras reintentar: $url"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$titulo" \
              --body "Falló dos veces seguidas; la vigilancia de la próxima semana lo reintenta: $url"
          fi

      - name: Avisar a la web
        # constitucion.app genera /estado, /leyes y la bitácora de los repos de datos
        # y de estas corridas, así que se redespliega en cuanto termina una
        # vigilancia, haya fallado o no. Después de `revisar` (y, por si acaso,
        # de que no quede un PR abierto), para que la web ya incluya lo fusionado.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          DATOS: OpenCodice/constitucion-mexicana
        run: |
          for _ in $(seq 1 30); do
            abiertos=$(gh pr list -R "$DATOS" --state open --label automatico --json number -q 'length')
            [ "$abiertos" = 0 ] && break
            sleep 30
          done
          for intento in 1 2 3; do
            gh api repos/OpenCodice/constitucion-web/dispatches -f event_type=datos-actualizados && exit 0
            sleep $((intento * 30))
          done
          # No falla la vigilancia: sus datos ya están publicados; solo la web se
          # queda atrás hasta el siguiente aviso o push.
          echo "::warning::No se pudo avisar a constitucion-web tras tres intentos."
