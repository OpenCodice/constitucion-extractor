name: Desplegar Workers
# El supervisor lee los inputs de aquí: la API no los devuelve.
run-name: "desplegar-workers origen=[${{ inputs.origen }}]"

# Despliega el Worker `scheduler` cuando cambia en main, después de sus
# pruebas, y comprueba que Cloudflare registró el despliegue. `egress-mx` no
# se despliega desde aquí: es un proxy autenticado y un error suyo lo dejaría
# abierto, así que se sigue desplegando a mano (ver egress-mx/README.md).

on:
  push:
    branches: [main]
    paths: ['scheduler/**']
  workflow_dispatch:
    inputs:
      origen:
        description: 'Quién lanzó la corrida (supervisor); vacío = a mano'
        required: false
        default: ''

permissions:
  contents: read

# Dos despliegues a la vez se pisarían; el que espera lleva el main más nuevo.
concurrency:
  group: desplegar-workers
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.164.0

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: node --check worker.js
      - run: node --test
      - run: npx --yes "$WRANGLER" deploy --dry-run

      - name: ¿Hay credenciales de Cloudflare?
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID de este repo: el Worker scheduler NO se desplegó. Hay que desplegarlo a mano (npx wrangler deploy en scheduler/)."
          fi

      - name: Desplegar y comprobar el despliegue
        # Solo main: una corrida a mano desde otra rama no publica su código.
        if: steps.cloudflare.outputs.listo == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          despliegues() {
            npx --yes "$WRANGLER" deployments list --json \
              | node -e 'const d = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(d.map((x) => x.id).sort().join("\n"))'
          }
          despliegues > /tmp/antes.txt
          npx --yes "$WRANGLER" deploy
          despliegues > /tmp/despues.txt
          nuevo=$(comm -13 /tmp/antes.txt /tmp/despues.txt)
          if [ -z "$nuevo" ]; then
            echo "::error::wrangler deploy terminó bien pero Cloudflare no lista ningún despliegue nuevo del Worker scheduler."
            exit 1
          fi
          echo "Despliegue nuevo: $nuevo"

  estado:
    # El supervisor (OpenCodice/supervisor) lee el nombre de este job para saber
    # si quedó otra tanda, y el artefacto `cadena` para saber cómo terminó cada
    # job y qué pidió.
    name: "estado pendiente=[false]"
    needs: [scheduler]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Lo que declaró cada job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" > cadena.json
      - uses: actions/upload-artifact@v4
        with:
          name: cadena
          path: cadena.json
          retention-days: 14
